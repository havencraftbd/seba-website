<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients UNCHANGED from logo-original.svg (same IDs, same colors) -->
    <linearGradient id="iso-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="iso-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="38%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="iso-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <linearGradient id="iso-inner-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <linearGradient id="iso-inner-lit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="gold-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="gold-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="gold-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>

  <!--
    HAVEN-ADMIN LOGO (EDGE-TO-EDGE): Arch + Gear, side margins 36.1px = minimum (uniform 1.2494x) (parametric rebuild, true 30-degree isometric kept):
    - Arch half-width : 200 -> 176  (overall width 400 -> 352, height kept)
    - Pillar thickness: 52 -> 40 -> 46 (polish)    (slimmer sides, hollow interior stays 208px)
    - Threshold       : scaled 0.8 about (256,393) -> 168x126 becomes 134x101,
                        bottom lifted from y=456 to y=443.4 (breathing room)
    - Overall span    : x 36.1..475.9, y 14..498 (edge-to-edge; side margin 36.1px, top/bottom 14px)
    - Admin gear      : 8 teeth, center (256,256.4), outer R87.5 / root r70, orange hub dot r17.5 (replaces cube; scaled 1.2494x)
  -->

  <!-- 1. INNER VAULT DEPTH WALLS -->
  <!-- Left Pillar Inner Receding Wall -->
  <polygon fill="url(#iso-inner-dark)" points="93.6,226.6 141.1,199.3 141.1,392.7 93.6,420.0" />
  <!-- Right Pillar Inner Lit Wall -->
  <polygon fill="url(#iso-inner-lit)" opacity="0.82" points="418.4,226.6 370.9,199.3 370.9,392.7 418.4,420.0" />
  <!-- Roof Underside Left & Right Vault Ceilings -->
  <polygon fill="url(#iso-right)" points="93.6,174.1 256.0,80.3 256.0,132.8 93.6,226.6" />
  <polygon fill="url(#iso-inner-dark)" points="256.0,80.3 418.4,174.1 418.4,226.6 256.0,132.8" />

  <!-- 2. OUTER PROTECTIVE BASTION STRUCTURE (30° Isometric Precision) -->
  <!-- Top Protective Canopy (Roof) -->
  <polygon fill="url(#iso-top)" points="256.0,14.0 475.9,140.9 418.4,174.1 256.0,80.3 93.6,174.1 36.1,140.9" />
  <!-- Left Fortress Pillar (Outer Face) -->
  <polygon fill="url(#iso-left)" points="36.1,140.9 93.6,174.1 93.6,420.0 36.1,386.8" />
  <!-- Right Fortress Pillar (Outer Face) -->
  <polygon fill="url(#iso-right)" points="475.9,140.9 418.4,174.1 418.4,420.0 475.9,386.8" />

  <!-- 3. GOLDEN THRESHOLD PORTAL (shrunk 20%, lifted off the bottom edge) -->
  <!-- Threshold Top Diamond Floor -->
  <polygon fill="url(#gold-top)" points="256.0,372.1 340.0,420.0 256.0,468.0 172.0,420.0" />
  <!-- Threshold Left Step Bevel -->
  <polygon fill="url(#gold-left)" points="172.0,420.0 256.0,468.0 256.0,498.0 172.0,450.0" />
  <!-- Threshold Right Step Bevel -->
  <polygon fill="url(#gold-right)" points="340.0,420.0 256.0,468.0 256.0,498.0 340.0,450.0" />

  <!-- 4. ADMIN GEAR (replaces cube: same center, light slate + orange hub dot) -->
  <polygon fill="#E2E8F0" stroke="#33414D" stroke-width="5" stroke-linejoin="round" points="342.1,241.1 342.1,271.6 324.2,272.1 315.3,293.5 327.6,306.6 306.2,328.0 293.1,315.7 271.7,324.6 271.2,342.4 240.8,342.4 240.3,324.6 218.9,315.7 205.8,328.0 184.4,306.6 196.7,293.5 187.8,272.1 169.9,271.6 169.9,241.1 187.8,240.6 196.7,219.3 184.4,206.1 205.8,184.8 218.9,197.0 240.3,188.1 240.8,170.3 271.2,170.3 271.7,188.1 293.1,197.0 306.2,184.8 327.6,206.1 315.3,219.3 324.2,240.6" />
  <circle cx="256.0" cy="256.4" r="17.5" fill="#ff8a00" />
</svg>
