<!DOCTYPE html>
<html lang="en" class="hvn-public-page">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — HavenCraft Admin</title>
  <link rel="icon" href="../logo/logo.svg" type="image/svg+xml">

  <!-- Fonts: Manrope (body) & Montserrat (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">

  <!-- HavenCraft Admin Theme -->
  <script src="../assets/js/theme.js?v=3.9"></script>
  <link rel="stylesheet" href="../assets/css/admin.css?v=3.8">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070911 radial-gradient(circle at 50% 20%, rgba(0, 200, 150, 0.08), transparent 70%);
      color: var(--text-main);
      font-family: var(--font-body);
      margin: 0;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 440px;
      background: rgba(13, 17, 28, 0.88);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 20px rgba(0, 200, 150, 0.08);
      overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeInDown 0.35s ease;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      padding: 32px 24px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }

    .login-logo-icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--info));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #041410;
      font-size: 1.8rem;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0, 200, 150, 0.35);
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .login-title span {
      color: var(--primary);
    }

    .login-subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .login-body {
      padding: 28px 24px;
    }

    .login-alert {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .login-alert.danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .login-alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input-icon-group {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-icon-group i.lead-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.05rem;
      pointer-events: none;
      z-index: 2;
    }

    .input-icon-group input {
      width: 100%;
      height: 44px;
      background: rgba(15, 21, 35, 0.7);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: #fff;
      padding: 0 44px 0 42px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-icon-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 200, 150, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-sm);
      border: 0;
      background: var(--primary);
      color: #041410;
      font-weight: 700;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: #00e5ab;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 200, 150, 0.35);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      padding: 16px 24px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.15);
      border-top: 1px solid var(--border);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  
    .toggle-setup-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
      z-index: 4;
    }

    .toggle-setup-pass i {
      position: static !important;
      transform: none !important;
      left: auto !important;
      top: auto !important;
      font-size: 1.15rem !important;
      color: inherit !important;
      pointer-events: auto !important;
      line-height: 1 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .toggle-setup-pass:hover {
      color: var(--primary);
    }

    .pass-mismatch-hint {
      display: none;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 6px;
    }

    .pass-mismatch-hint.ok { color: var(--primary); }
    .pass-mismatch-hint.bad { color: #f87171; }

    /* Chrome autofill would paint white over the dark inputs — force dark fill */
    .input-icon-group input:-webkit-autofill,
    .input-icon-group input:-webkit-autofill:hover,
    .input-icon-group input:-webkit-autofill:focus {
      -webkit-text-fill-color: #fff;
      caret-color: #fff;
      -webkit-box-shadow: 0 0 0 1000px #101728 inset;
      transition: background-color 9999s ease-in-out 0s;
    }

    @keyframes authFadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-box {
      animation: authFadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @media (prefers-reduced-motion: reduce) {
      .login-box { animation: none; }
    }

  </style>
</head>

<body>
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <div class="login-title" id="pageTitle">Haven<span>Craft</span> Password Reset</div>
      <div class="login-subtitle" id="pageSubtitle">
        Enter your registered email address to receive a secure recovery link.
      </div>
    </div>

    <div class="login-body">
      <!-- Alerts -->
      <div class="login-alert" id="setupAlert">
        <i class="bi bi-exclamation-triangle-fill" id="alertIcon"></i>
        <span id="setupAlertText"></span>
      </div>

      <!-- Mode 1: Request Password Reset Form -->
      <form id="requestResetForm" style="display: block;">
        <div class="form-group">
          <label class="form-label" for="resetEmail">Staff Email Address</label>
          <div class="input-icon-group">
            <i class="bi bi-envelope lead-icon"></i>
            <input type="email" id="resetEmail" placeholder="your-name@havencraft.pro" required autocomplete="email">
          </div>
        </div>

        <button type="submit" id="btnRequestReset" class="btn-submit">
          <i class="bi bi-send-fill"></i>
          <span>Send Recovery Link</span>
        </button>
      </form>

      <!-- Mode 2: Set New Password Form (When opening via recovery email link) -->
      <form id="setupPasswordForm" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="newPassword">Create New Password</label>
          <div class="input-icon-group">
            <i class="bi bi-key-fill lead-icon"></i>
            <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-setup-pass" data-target="newPassword" title="Show / Hide password"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <div class="input-icon-group">
            <i class="bi bi-check2-circle lead-icon"></i>
            <input type="password" id="confirmPassword" placeholder="Re-type new password" minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-setup-pass" data-target="confirmPassword" title="Show / Hide password"><i class="bi bi-eye"></i></button>
          </div>
          <div class="pass-mismatch-hint" id="passMismatchHint"></div>
        </div>

        <button type="submit" id="btnSubmitPassword" class="btn-submit">
          <i class="bi bi-check-lg"></i>
          <span>Save New Password & Enter Dashboard</span>
        </button>
      </form>
    </div>

    <div class="login-footer">
      <a href="index.html" id="backToSignInLink">
        <i class="bi bi-arrow-left"></i> Back to Staff Sign In
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/config.js?v=3.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
  <script src="../assets/js/supabase.js?v=3.4"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const client = window.initHavenSupabase ? window.initHavenSupabase() : window.supabaseClient;
      const requestForm = document.getElementById('requestResetForm');
      const setupForm = document.getElementById('setupPasswordForm');
      const alertBox = document.getElementById('setupAlert');
      const alertText = document.getElementById('setupAlertText');
      const alertIcon = document.getElementById('alertIcon');
      const pageTitle = document.getElementById('pageTitle');
      const pageSubtitle = document.getElementById('pageSubtitle');
      const btnRequest = document.getElementById('btnRequestReset');
      const btnSubmit = document.getElementById('btnSubmitPassword');

      const backLink = document.getElementById('backToSignInLink');
      if (backLink && window.location.protocol !== 'file:') {
        backLink.href = '/login';
      }

      function showAlert(msg, isSuccess) {
        alertBox.className = 'login-alert ' + (isSuccess ? 'success' : 'danger');
        alertIcon.className = 'bi ' + (isSuccess ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill');
        alertText.textContent = msg;
        alertBox.style.display = 'flex';
      }

      function switchToNewPasswordMode() {
        requestForm.style.display = 'none';
        setupForm.style.display = 'block';
        pageTitle.innerHTML = 'Haven<span>Craft</span> Set New Password';
        pageSubtitle.textContent = 'Enter your new secure password below to regain full access.';
        document.getElementById('newPassword').required = true;
        document.getElementById('confirmPassword').required = true;
      }

      // Check URL hash or PKCE query params for access_token / code / recovery type
      const hash = window.location.hash || '';
      const params = new URLSearchParams(window.location.search);
      const isRecovery = hash.includes('type=recovery') || hash.includes('access_token=') || params.get('type') === 'recovery' || params.has('code') || params.has('token_hash');

      if (isRecovery) {
        switchToNewPasswordMode();
      }

      if (client && client.auth) {
        client.auth.onAuthStateChange(async (event, session) => {
          if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && isRecovery)) {
            switchToNewPasswordMode();
          }
        });
      }

      // Handle Request Reset Link submission
      requestForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value.trim();
        if (!email) return;

        btnRequest.disabled = true;
        btnRequest.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> <span>Sending Link...</span>';
        alertBox.style.display = 'none';

        try {
          if (!client || !client.auth) throw new Error('Authentication client unavailable.');

          const redirectUrl = window.location.href.split('#')[0];
          const { error } = await client.auth.resetPasswordForEmail(email, {
            redirectTo: redirectUrl
          });

          if (error) throw error;

          btnRequest.disabled = false;
          btnRequest.innerHTML = '<i class="bi bi-check2"></i> <span>Request Submitted</span>';
          showAlert('If an account exists for ' + email + ', a password recovery link has been sent. Please check your inbox or spam folder.', true);
        } catch (err) {
          btnRequest.disabled = false;
          btnRequest.innerHTML = '<i class="bi bi-send-fill"></i> <span>Send Recovery Link</span>';
          showAlert(err.message || 'Failed to send recovery link. Please try again.', false);
        }
      });

      // Handle Set New Password submission
      setupForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const p1 = document.getElementById('newPassword').value;
        const p2 = document.getElementById('confirmPassword').value;

        if (p1 !== p2) {
          showAlert('Passwords do not match. Please re-enter carefully.', false);
          return;
        }

        if (p1.length < 8) {
          showAlert('Password must be at least 8 characters long.', false);
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> <span>Saving Password...</span>';
        alertBox.style.display = 'none';

        try {
          if (!client || !client.auth) throw new Error('Authentication client unavailable.');

          const { error } = await client.auth.updateUser({ password: p1 });
          if (error) throw error;

          showAlert('Password successfully updated! Redirecting to Dashboard...', true);
          setTimeout(() => {
            const isFile = window.location.protocol === 'file:';
            window.location.replace(isFile ? '../index.html' : '/');
          }, 1200);
        } catch (err) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="bi bi-check-lg"></i> <span>Save New Password & Enter Dashboard</span>';
          showAlert(err.message || 'Failed to update password. Your recovery link may have expired.', false);
        }
      });
    });
  </script>

  <script>
    // Show / hide password toggles + live match hint
    document.querySelectorAll('.toggle-setup-pass').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const input = document.getElementById(btn.getAttribute('data-target'));
        if (!input) return;
        const icon = btn.querySelector('i');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    });

    const newPass = document.getElementById('newPassword');
    const confirmPass = document.getElementById('confirmPassword');
    const hint = document.getElementById('passMismatchHint');

    function updateMatchHint() {
      if (!newPass.value && !confirmPass.value) {
        hint.style.display = 'none';
        confirmPass.style.borderColor = '';
        return;
      }
      hint.style.display = 'block';
      if (confirmPass.value === newPass.value) {
        hint.textContent = 'Passwords match';
        hint.className = 'pass-mismatch-hint ok';
        confirmPass.style.borderColor = 'var(--primary)';
      } else {
        hint.textContent = 'Passwords do not match yet';
        hint.className = 'pass-mismatch-hint bad';
        confirmPass.style.borderColor = '#f87171';
      }
    }

    newPass.addEventListener('input', updateMatchHint);
    confirmPass.addEventListener('input', updateMatchHint);
  </script>

</body>

</html>
