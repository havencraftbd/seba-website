  history-default-limit: 36
  # Maximum history limit a user/admin can request in /shards history <player> [limit]
  history-max-limit: 108
  # Automatically prune old database transactions per player to keep DB lightweight (0 = keep all)
  max-saved-transactions-per-player: 0

