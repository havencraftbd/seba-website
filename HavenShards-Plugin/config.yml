# ==============================================================================
#                      HavenShards Main Configuration
#                  [Server Economy Balanced for Spawners & Trial Keys]
# ==============================================================================

# ------------------------------------------------------------------------------
#  PlaceholderAPI Reference (Use in Scoreboard, TAB, TitleManager, Holograms)
# ------------------------------------------------------------------------------
# Economy:
# %havenshards_balance%                 - Raw numeric balance (e.g. 1250.0)
# %havenshards_balance_formatted%       - Formatted balance (e.g. 1,250)
# %havenshards_currency_name%           - Currency name (e.g. Shards)
# %havenshards_currency_symbol%         - Currency symbol (e.g. ✨)
#
# Boosters & Multipliers:
# %havenshards_booster_multiplier%      - Active global booster multiplier (e.g. 2.0)
# %havenshards_booster_active%          - Global booster active state (true / false)
# %havenshards_booster_remaining%       - Remaining time formatted (e.g. 30m 15s)
# %havenshards_rank_multiplier%         - Player rank multiplier (e.g. 1.5)
# %havenshards_total_multiplier%        - Total multiplier = Global * Rank (e.g. 3.0)
#
# Playtime Progress:
# %havenshards_playtime_minutes%        - Active playtime minutes
# %havenshards_playtime_remaining%      - Minutes left for next playtime reward
# %havenshards_playtime_progress_percent%- Progress percentage (e.g. 70)
# %havenshards_playtime_progress_bar%   - Visual progress bar (e.g. ■■■■■■■□□□)
#
# Leaderboard Top 10:
# %havenshards_top_name_1% to 10        - Name of #1 to #10 richest player
# %havenshards_top_balance_1% to 10     - Raw balance of #1 to #10 richest player
# %havenshards_top_balance_formatted_1% - Formatted balance of #1 to #10 richest player
# ------------------------------------------------------------------------------

# ==============================================================================
#    GENERAL & SYSTEM SETTINGS
# ==============================================================================

# Currency Display Settings
currency:
  name: Shards
  singular-name: Shard
  plural-name: Shards
  symbol: ✨
  format: '#,##0.##'
  compact-formatted: true

# Maximum balance a player can hold (prevents economy overflow exploits)
max-balance: 1000000.0

# Plugin Prefix
prefix: '&#92bed8&lShards &#666666&l» &7'

# Database Settings: Options- SQLITE (Default) & MYSQL
database:
  type: SQLITE
  mysql:
    host: localhost
    port: 3306
    database: havenshards
    username: root
    password: ''
    ssl: false

# Vault Economy Provider Settings
vault:
  # If true, registers HavenShards with Highest service priority in Vault
  # Set false if you use EssentialsX/Coins as primary economy and Shards as secondary currency
  register-as-primary-economy: false

# GeyserMC & Bedrock Player Compatibility
geyser-bedrock:
  enabled: true
  # Open native Bedrock Form UI (UI Buttons) for Floodgate/Geyser players instead of chest GUI
  use-native-forms: false

# ==============================================================================
#    CORE ECONOMY FEATURES
# ==============================================================================

# Player Payments (/shards pay)
pay:
  # Master toggle to enable or disable /shards pay transactions
  enabled: false
  # Minimum amount a player can send to another player (prevents tiny spam)
  minimum-amount: 1.0
  # Cooldown between pay commands in seconds (prevents rapid payment spam)
  cooldown-seconds: 3
  # Daily Payment Limits (Protects against account hacks, alt-farming & RMT)
  daily-limits:
    # Enable/disable daily payment restrictions
    enabled: true
    # Maximum total shards a player can send per day (Set -1 or 0 for unlimited)
    max-daily-amount: 500.0
    # Maximum number of /shards pay transactions per day (Set -1 or 0 for unlimited)
    max-daily-transactions: 5
    # Timezone for midnight (00:00) reset (Default: Asia/Dhaka for Bangladesh Standard Time)
    reset-timezone: Asia/Dhaka
    # Bypass permission for Staff/VIPs (given to OP by default)
    bypass-permission: havenshards.pay.limit.bypass
  # Transaction Tax Settings (Money sink to control economy inflation)
  tax:
    # Set to true to enable transaction tax on /shards pay
    enabled: false
    # Tax percentage (e.g., 5.0 = 5% tax)
    percentage: 0.0
    # Tax Calculation Mode:
    # 'CHARGE_SENDER'     -> Extra fee charged to sender (sends 100, sender pays 105, receiver gets 100)
    # 'DEDUCT_FROM_AMOUNT'-> Fee deducted from transfer (sends 100, sender pays 100, receiver gets 95)
    mode: CHARGE_SENDER
    # Permission that bypasses the transaction tax (given to OP by default)
    bypass-permission: havenshards.pay.notax

# Physical Shard Item & Withdraw Settings
physical-item:
  # Enable/disable physical shard items and /shards withdraw command
  enabled: true
  # If true, blocks players from withdrawing/depositing shards while in creative mode
  block-creative-mode: true
  # Minimum amount of shards required to withdraw an item
  minimum-withdraw: 5.0
  # Maximum amount of shards allowed per single withdrawal (Set -1 or 0 for unlimited)
  maximum-withdraw: 500.0
  # Cooldown between withdraw commands/prompts in seconds (prevents rapid withdraw spam)
  cooldown-seconds: 5
  # Daily Withdrawal Limits (Prevents account draining & unauthorized alt dumping)
  daily-limits:
    # Enable/disable daily withdrawal restrictions
    enabled: true
    # Maximum total shards a player can withdraw per day (Set -1 or 0 for unlimited)
    max-daily-amount: 1000.0
    # Maximum number of withdrawals a player can make per day (Set -1 or 0 for unlimited)
    max-daily-withdraws: 5
    # Timezone for midnight (00:00) reset (Default: Asia/Dhaka for Bangladesh Standard Time)
    reset-timezone: Asia/Dhaka
    # Bypass permission for Staff/VIPs (given to OP by default)
    bypass-permission: havenshards.withdraw.limit.bypass
  # Physical Shard Minting Fee / Tax (Optional money sink on physical withdrawals)
  tax:
    # Set to true to enable transaction tax on /shards withdraw
    enabled: false
    # Tax percentage (e.g., 2.0 = 2% fee deducted from balance on withdraw)
    percentage: 0.0
    # Permission that bypasses the withdrawal tax (given to OP by default)
    bypass-permission: havenshards.withdraw.notax
  # Enable/disable right-clicking to claim (set false to require /shards deposit)
  right-click-redeem: true
  # Action when inventory is full during withdrawal:
  # Options: 'DROP_ON_GROUND' (Drops item at player's feet) OR 'BLOCK_WITHDRAW' (Blocks withdraw & warns player)
  full-inventory-action: BLOCK_WITHDRAW
  # Timeout in seconds for chat withdraw prompt
  withdraw-prompt-timeout: 30
  
  material: AMETHYST_SHARD
  custom-model-data: 0
  name: '&#00E5FF&l✨ %amount% Shards'
  lore:
  - '&7Right-click or use &e/shards deposit'
  - '&7to claim into your virtual balance!'
  - ''
  - '&eRight-click or /shards deposit to Claim!'
  glow: true
  # Master toggle to enable or disable /shards withdraw
  withdraw-enabled: true
  # Master toggle to enable or disable /shards deposit & physical item redeeming
  deposit-enabled: true

# ==============================================================================
#    BOOSTERS & MULTIPLIERS
# ==============================================================================

# Global Shards Booster Settings
booster:
  default-multiplier: 1.0

# Rank & Permission Shards Multipliers
rank-multipliers:
  enabled: true
  # Maximum cap for combined multipliers (Rank Multiplier * Global Booster) to prevent inflation
  max-total-multiplier: 1.0
  groups:
    elite:
      permission: havenshards.multiplier.elite
      multiplier: 1.0
    mvp:
      permission: havenshards.multiplier.mvp
      multiplier: 1.0
    vip:
      permission: havenshards.multiplier.vip
      multiplier: 1.0

# ==============================================================================
#    REWARD SYSTEMS
# ==============================================================================

# Playtime Reward Settings (15 mins = 3 Shards | ~12 Shards/hour active play)
playtime-rewards:
  enabled: true
  # Reward interval in minutes
  interval-minutes: 10
  # Shards granted per interval
  reward-amount: 5.0
  # AFK Reward Multiplier (1.0 = Full reward, 0.5 = Half reward, 0.0 = No reward for AFK)
  afk-multiplier: 0.5
  # Send actionbar / message notification when granted
  notify: true
  # Notification display type: ACTION_BAR or CHAT
  display-type: ACTION_BAR
  # Record earned reward in /shards history
  log-history: true
  message: '&#00A4FC+%amount% ✨ Shards &7earned for %interval% minutes of active playtime!'
  
  # Strict Anti-AFK (Prevents AFK pools and simple bots from getting full rewards)
  strict-anti-afk:
    enabled: false
    # If a player doesn't move outside this radius from their anchor point, they are considered AFK
    trigger-radius: 10.0
    # Time in minutes they must stay within the radius before being flagged as AFK for rewards
    trigger-time-minutes: 3
    # The multiplier for bots/AFK pool users (0.0 = no rewards, 0.5 = half)
    afk-multiplier: 0.0

# Daily Login Rewards & Streak System (/shards daily)
daily-rewards:
  enabled: true
  base-reward: 10.0
  # Streak Milestone Bonuses (Extra bonus shards added on specific streak days)
  # You can freely change, add, or remove any milestone days! (e.g. day-3, day-5, day-7, day-14, day-30)
  streak-bonuses:
    day-3: 50.0 # Extra bonus for 3-day streak (Total 25 Shards)
    day-7: 100.0 # Extra bonus for 7-day streak (Total 50 Shards)
    day-14: 200.0 # Extra bonus for 14-day streak (Total 110 Shards)
    day-30: 500.0 # Extra bonus for 30-day streak (Total 260 Shards)
  reset-on-miss: true # Reset streak if player misses a day
  notify: true
  # Notification display type: ACTION_BAR or CHAT
  display-type: CHAT
  # Record earned reward in /shards history
  log-history: true
  message: '&#00A4FC+%amount% ✨ Shards &7claimed for Daily Reward! &8(&eDay %streak%
    Streak&8)'
  already-claimed-message: '&cYou have already claimed your daily reward! Next claim
    in: &e%remaining%'

