# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  HavenSell - Sell History GUI Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

player-head:
  slot: 48
  material: PLAYER_HEAD
  name: '&6{player}''s History'
  lore:
  - '&7Total Sold: &f{items}'
  - '&7Total Earned: &6{symbol}{money}'
# GUI title (supports color codes)
# Placeholders: {player} = player name
title: '&8&lSell History &7— &f{player}'

# GUI size in rows (must be enough for history entries)
rows: 6

# Filler item for borders/empty slots
filler:
  enabled: true
  material: AIR
  name: ' '

# ─── Stats Panel (top row) ───────────────────

# Summary item - shows total stats
summary:
  slot: 50
  material: BOOK
  name: '&6&l📊 Sell Statistics'
  lore:
  - ''
  - '&7Player: &f{player}'
  - '&7Total Items Sold: &a{total_items}'
  - '&7Total Earned: &6{symbol}{total_earned}'
  - ''
  - '&8Last {max_entries} transactions shown below'
  - ''

# ─── History Entries ─────────────────────────

# Slots where history entries appear (rows 2-5 = slots 9-44, skip borders)
# Leave slot 0-8 for top bar, 45-53 for bottom bar
history-start-slot: 0
history-end-slot: 53

# Item appearance for each history entry
history-item:
  material: PAPER
  name: '&a&lSell Transaction'
  lore:
  - ''
  - '&7Items Sold: &f{items}'
  - '&7Earned: &6{symbol}{money}'
  - '&7Date: &e{date}'
  - ''

# Maximum history entries to display
max-entries: 36

# ─── Bottom Row Controls ─────────────────────

# Border row (bottom)
border:
  material: AIR
  name: ' '

# Back button (returns to main sell GUI)
back-button:
  slot: 45
  material: ARROW
  name: '&c&lBack'
  lore:
  - '&7Click to return to'
  - '&7the Sell GUI'

# Close button
close-button:
  slot: 53
  material: BARRIER
  name: '&4&lClose'
  lore:
  - '&7Click to close'
