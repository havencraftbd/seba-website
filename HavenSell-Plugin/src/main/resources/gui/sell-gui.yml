# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  HavenSell - Sell GUI Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# GUI title (supports color codes)
title: "&8&lSell Items"

# GUI size in rows (max 6 rows = 54 slots)
rows: 5

# Filler item for the bottom control row
# Set to AIR to disable filler
filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

# Control buttons (all on bottom row)
buttons:
  close:
    enabled: true
    slot: 42
    material: BARRIER
    name: "&c&lClose"
    lore:
      - "&7Click to close the menu"
      - "&7Unsellable items will be returned"
      - "&eValid items will be sold on close!"

  # Use PLAYER_HEAD to show player skin head, or other materials like SUNFLOWER, GOLD_INGOT, etc.
  balance:
    enabled: true
    slot: 38
    material: PLAYER_HEAD
    name: "&6&lYour Balance"
    lore:
      - ""
      - "&7Balance: &a{symbol}{balance}"
      - ""
      - "&7Total Sold: &f{total_items} items"
      - "&7Total Earned: &a{symbol}{total_earned}"
      - ""
      - "&eClick to view sell history"

  sell:
    enabled: true
    slot: 40
    material: EMERALD
    name: "&a&lSell Items"
    lore:
      - "&7Click to sell all items in the GUI"
      - "&7Only active when sell-on-close is disabled"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Confirmation GUI
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
confirm:
  title-hand: "&8Confirm Sell Hand?"
  title-all: "&8Confirm Sell All?"
  rows: 3
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  buttons:
    confirm:
      slot: 11
      material: LIME_WOOL
      name: "&a&lConfirm"
      lore:
        - "&7Click to confirm sell"
    cancel:
      slot: 15
      material: RED_WOOL
      name: "&c&lCancel"
      lore:
        - "&7Click to cancel"
