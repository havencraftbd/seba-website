name: HavenSell
version: '${project.version}'
main: com.haven.sell.HavenSell
api-version: '1.21'
description: A professional sell system plugin for survival servers
author: Haven
depend:
  - Vault
softdepend:
  - PlaceholderAPI

commands:
  sell:
    description: Open the sell GUI or manage the plugin
    usage: /<command> [hand|all|price|reload|history [player]]
    permission: havensell.use
  price:
    description: Browse all item sell prices
    usage: /<command>
    permission: havensell.use
    aliases: []
  worth:
    description: Browse all item sell prices
    usage: /<command>
    permission: havensell.use
    aliases: []

permissions:
  havensell.use:
    description: Allows players to use /sell, /sell history, /price, and /worth
    default: true
  havensell.admin:
    description: Allows admins to reload and view other players' history
    default: op
