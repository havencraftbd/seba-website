# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  HavenPunish — Messages Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# All messages support & color codes and hex colors (&#RRGGBB).
# Changing the prefix here will update BOTH console & in-game messages.

# In-game prefix (supports hex colors)
# Format: prefix • message
prefix: "&#92bed8&lPunish &#666666&l» &7"

# Console prefix (plain text, no color codes)
console-prefix: "HavenPunish •"

# Command messages
no-permission: "&cYou don't have permission to do this."
no-console: "&cThis command can only be used by players."
usage: "&cUsage: /punish <player>"
reload-success: "&aHavenPunish reloaded successfully!"

# Target checks
player-offline: "&cThat player is not online."
target-exempt: "&cThis player is exempt from punishment."
self-punish: "&cYou cannot punish yourself!"

# Execution
punishment-executed: "&a✔ Punishment executed successfully!"
punishment-cancelled: "&c✖ Punishment cancelled."
cooldown: "&7⏱ Please wait &f{remaining}s &7before issuing another punishment."
