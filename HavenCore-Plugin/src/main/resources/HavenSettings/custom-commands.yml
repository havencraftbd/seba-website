# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  HavenSettings - Custom Commands
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Global switch:
# Set to true when you want to use custom command toggles.
enabled: false
#
# Define custom commands that players can toggle ON/OFF.
# Each entry creates a toggle button in the settings GUI.
#
# Format:
#   id:
#     name: "Display name in GUI"
#     commands: [list of commands to block when OFF]
#     material-on: Material when enabled
#     material-off: Material when disabled
#     permission: permission node required to see/use this toggle (required)
#     default: true/false (default state for new players)
#     lore:
#       - "Description lines"

# No custom commands defined by default.
# To add custom commands, set 'enabled: true' above
# and add entries below following this format:
#
# custom-commands:
#   socialspy:
#     name: "&e&lSocial Spy"
#     commands:
#       - "/socialspy"
#     material-on: SPYGLASS
#     material-off: GLASS
#     permission: "settings.toggle.socialspy"
#     default: false
#     lore:
#       - ""
#       - "&7Toggle social spy notifications"
#       - ""
#       - "&7Status: {status}"
#       - ""
#       - "&eClick to toggle!"
#
#   fly-toggle:
#     name: "&e&lFly Mode"
#     commands:
#       - "/fly"
#     material-on: FEATHER
#     material-off: ARROW
#     permission: "settings.toggle.fly"
#     default: false
#     lore:
#       - ""
#       - "&7Toggle flight mode"
#       - "&7Status: {status}"
#       - "&eClick to toggle!"
custom-commands: {}
