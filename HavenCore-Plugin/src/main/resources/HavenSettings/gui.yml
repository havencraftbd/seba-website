# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  HavenSettings - GUI Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

title: "&8&lPlayer Settings"
rows: 3

# Filler glass pane
filler:
  enabled: false
  material: BLACK_STAINED_GLASS_PANE
  name: " "

# Toggle buttons (uses SIGN items)
# slot: inventory slot (0-26 for 3 rows)
# material-on / material-off: material when enabled/disabled
# name: display name ({status} replaced with ON/OFF)
# lore: description lines ({status} replaced)

buttons:

  public-chat:
    slot: 10
    material-on: pale_oak_sign
    material-off: crimson_sign
    name: "&e&lPublic Chat"
    lore:
      - ""
      - "&7Toggle public chat visibility"
      - "&7When OFF you won't see public chat"
      - ""
      - "&7Status: {status}"
      - ""
      - "&eClick to toggle!" 

  private-message:
    slot: 11
    material-on: pale_oak_sign
    material-off: crimson_sign
    name: "&e&lPrivate Messages"
    lore:
      - ""
      - "&7Toggle private messages"
      - "&7Commands: &f/msg, /tell"
      - ""
      - "&7Status: {status}"
      - ""
      - "&eClick to toggle!"

  scoreboard:
    slot: 12
    material-on: pale_oak_sign
    material-off: crimson_sign
    name: "&e&lScoreboard"
    lore:
      - ""
      - "&7Toggle scoreboard visibility"
      - "&7(TAB plugin scoreboard)"
      - ""
      - "&7Status: {status}"
      - ""
      - "&eClick to toggle!"

  tpa-confirmation:
    slot: 13
    material-on: pale_oak_sign
    material-off: crimson_sign
    name: "&e&lTPA Confirm Popup"
    lore:
      - ""
      - "&7Toggle teleport confirmation popup"
      - "&7for dangerous worlds (Nether, End)"
      - ""
      - "&7Status: {status}"
      - ""
      - "&eClick to toggle!"

  tpa:
    slot: 14
    material-on: pale_oak_sign
    material-off: crimson_sign
    name: "&e&lTPA Requests"
    lore:
      - ""
      - "&7Toggle teleport requests"
      - "&7Commands: &f/tpa"
      - ""
      - "&7Status: {status}"
      - ""
      - "&eClick to toggle!"

  tpahere:
    slot: 15
    material-on: pale_oak_sign
    material-off: crimson_sign
    name: "&e&lTPAHere Requests"
    lore:
      - ""
      - "&7Toggle tpahere requests"
      - "&7Commands: &f/tpahere"
      - ""
      - "&c&l[!] WARNING:"
      - "&7Teleports you to another player."
      - "&7Only accept requests from players"
      - "&7you trust!"
      - ""
      - "&7Status: {status}"
      - ""
      - "&eClick to toggle!"

  night-vision:
    slot: 16
    material-on: pale_oak_sign
    material-off: crimson_sign
    name: "&e&lNight Vision"
    lore:
      - ""
      - "&7Toggle permanent night vision"
      - ""
      - "&7Status: {status}"
      - ""
      - "&eClick to toggle!"

# Custom commands start at this slot (fills sequentially)
custom-commands-start-slot: 17

# Close button
close:
  slot: 22
  material: BARRIER
  name: "&c&lClose"
  lore:
    - "&7Click to close"

# Status display text
status-on: "&a&lON"
status-off: "&c&lOFF"

# Sound configurations
# Bukkit sound names (e.g. UI_BUTTON_CLICK, BLOCK_CHEST_OPEN, BLOCK_CHEST_CLOSE)
# Or Minecraft sound keys (e.g. ui.button.click, block.chest.open, block.chest.close)
sounds:
  open: "BLOCK_CHEST_OPEN"
  click: "UI_BUTTON_CLICK"
  close: "BLOCK_CHEST_CLOSE"
