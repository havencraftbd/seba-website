    cancel-delete:
      - "&7Abort deletion and go back."

# ============================================================
# OP Security Configuration (Anti-Abuse & Anti-Hijack)
# ============================================================
op-security:
  enabled: true
  
  # De-OP player instantly when they leave or get kicked from server
  deop-on-quit: true
  
  # De-OP player instantly when they join server (No player joins with OP active)
  deop-on-join: true
  
  # Restrict in-game /op command so regular OP staff cannot OP others
  restrict-op-command: true
  
  # Restrict in-game /deop command (set to false to allow /deop command in-game)
  restrict-deop-command: false
  
  # Restrict console /op command so console can ONLY OP players listed in allowed-op-issuers
  restrict-console-op-targets: true
  
  # List of player names allowed to receive/issue OP (Only players in this list can be OPed via Console or /opauth)
  allowed-op-issuers:
    - JU3L_
    
  # Enable password-protected /opauth command to safely gain OP in-game
  use-op-password: false
  
  # Secret password required for /opauth <password>
  op-password: "ChangeThisSecretPassword123!"
  
  # Log security events to console
  log-events: true
  
  # Custom security messages
  messages:
    deop-on-join-notice: "&cYour OP status was automatically removed for security on join."
    deop-on-quit-log: "&cPlayer &e{player} &cwas de-OPed upon leaving the server."
    deop-on-join-log: "&cPlayer &e{player} &cwas de-OPed upon joining the server."
    op-command-blocked: "&cYou are not authorized to use the /op command."
    deop-command-blocked: "&cYou are not authorized to use the /deop command."
    op-command-blocked-log: "&cPlayer &e{player} &ctried to execute: &f{command}"
    console-op-blocked-log: "&cThe /op command is blocked."
    console-op-unauthorized-target-log: "&cCannot grant OP to &e{player}&c! Access denied."
    opauth-disabled: "&cThe /opauth command system is currently disabled."
    opauth-wrong-password: "&cIncorrect security password."
    opauth-success: "&aSecurity authentication successful! You have been granted OP status."
    opauth-success-log: "&aPlayer &e{player} &cauthenticated using /opauth and gained OP."
    opauth-usage: "&cUsage: /opauth <password>"

# ============================================================
# Team EnderChest Anti-Dupe & Security Protection
# ============================================================
team-echest-security:
  enabled: true
  
  # Lock shared team chest so only 1 player can view/edit it at any given time.
  # This 100% eliminates race-conditions and concurrent shift-click duplication exploits.
  single-viewer-lock: true
  
  # Active click & drag interceptor fail-safe if multiple viewers somehow bypass opening
  click-protection: true
  
  # Cooldown between opening team chest to prevent macro / packet spam flooding
  cooldown:
    enabled: true
    cooldown-ms: 750
    
  # Forcibly close team chest when player teleports (/tpa, /home, /spawn, etc.)
  close-on-teleport: true
  
  # Forcibly close team chest when player takes damage in combat
  close-on-damage: true
  
  # Forcibly close team chest when player changes world
  close-on-world-change: true

  # ============================================================
  # Kick / Leave / Unauthorized Access Protection & Punishment
  # ============================================================
  # Forcibly close team chest when player gets kicked (/team kick <player>)
  close-on-team-kick: true

  # Forcibly close team chest when player leaves team (/team leave)
  close-on-team-leave: true

  # Forcibly close team chest when team is disbanded (/team disband)
  close-on-team-disband: true

  # Real-time team membership verification on every click/drag in shared echest
  validate-team-membership: true

  # Punishment Actions when a kicked/non-member tries to steal/dupe items from team echest
  punishment:
    enabled: true
    # Commands executed by console (%player% and %reason% are dynamically replaced)
    # Examples:
    #   - "tempban %player% 3d %reason%"
    #   - "ban %player% %reason%"
    #   - "warn %player% %reason%"
    #   - "kick %player% %reason%"
    commands:
      - "tempban %player% 3h %reason%"
    # Broadcast security alert to online staff members
    notify-staff: true
    staff-permission: "havencore.security.notify"
  
  # Log anti-dupe security alerts to console
  log-events: true
  
  # Title keywords used to identify team enderchests
  matched-titles:
    - team enderchest
    - team chest
    - team echest
    - team's chest
    - team's enderchest
    - "[team]"
    
  # Custom notifications
  messages:
    already-in-use: "&cTeam member &e{player} &cis currently viewing the team chest! Please wait until they finish."
    cooldown: "&cPlease wait a moment before opening the team chest again."
    conflict-detected: "&cMultiple viewers detected on shared chest. Access suspended for safety."
    closed-on-combat: "&cYour team chest was closed due to taking damage."
    not-in-team: "&c[Security] You are no longer a member of this team! Your chest access has been terminated."
    punish-reason: "Attempting to steal/dupe items from Team EnderChest after being kicked."
    staff-alert: "&c&l[ALERT] &e{player} &7attempted to take items from a team chest after being kicked! Auto-punished."

