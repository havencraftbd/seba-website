      - "&7Teleport online &e{team} &7members to their team home."
    update-loc:
      - "&7Relocates this home to your current"
      - "&7location."
    update-team-loc:
      - "&7Relocates &e{team}&7's home to your"
      - "&7current location."
    delete-home:
