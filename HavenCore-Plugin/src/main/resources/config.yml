      - "&8&m-------------------------"
      - "&8» &7World: &b{world}"
      - "&8» &7Location: &f{x}, {y}, {z}"
      - "&8» &7Rotation: &8Yaw: &f{yaw}° &8| Pitch: &f{pitch}°"
      - "&8&m-------------------------"
      - "&e Click to open Action Menu"
    team-home:
      - "&8&m-------------------------"
      - "&8» &7Team: &e{team}"
      - "&8» &7World: &b{world}"
      - "&8» &7Location: &f{x}, {y}, {z}"
      - "&8» &7Rotation: &8Yaw: &f{yaw}° &8| Pitch: &f{pitch}°"
      - "&8&m-------------------------"
      - "&e Click to open Team Home Actions"
    tp-admin:
      - "&7Teleport directly to this home location."
    send-player:
      - "&7Teleport &e{player} &7to their own home."
      - "&7(Only works if player is online)"
