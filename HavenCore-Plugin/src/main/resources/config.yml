# ============================================================
# HavenCore - Main Configuration
# ============================================================
# Welcome to HavenCore!
# 
# Module-specific configurations are located in their respective folders:
# - plugins/HavenCore/HavenSync/config.yml
# - plugins/HavenCore/Leaderboard/config.yml
# 
# Core system settings can be configured below.

core:
  debug-mode: false
  module-loading-delay-ticks: 20
  
  # Plugin Prefix (Changing this will automatically update all messages across HavenCore)
  prefix: "&#92bed8&lHavenCraft &#666666&l» &7"

