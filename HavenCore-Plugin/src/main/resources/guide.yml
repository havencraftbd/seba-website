# ============================================================
# HavenCore - Commands & Permissions Guide (YML Format)
# ============================================================

commands:
  havencore:
    aliases: [hc]
    usage: "/havencore reload"
    description: "প্লাগইনের কনফিগারেশন রিলোড করার জন্য।"
    permission: "havencore.reload"
  leaderboard:
    aliases: [lb]
    usage: "/leaderboard"
    description: "লিডারবোর্ড মেনু খোলার জন্য।"
    permission: "leaderboard.use"
  settings:
    aliases: []
    usage: "/settings [reload]"
    description: "নিজস্ব বা প্লেয়ার সেটিংস মেনু খোলার জন্য।"
    permission: "settings.use"
  nv:
    aliases: [nightvision]
    usage: "/nv"
    description: "ইনফিনিট নাইট ভিশন টগল করার জন্য।"
    permission: "settings.nv"
  sb:
    aliases: [scoreboard]
    usage: "/sb"
    description: "স্কোরবোর্ড হাইড/শো টগল করার জন্য।"
    permission: "settings.sb"
  punish:
    aliases: [p]
    usage: "/punish <player>"
    description: "প্লেয়ারকে শাস্তি দেওয়ার GUI খোলার জন্য।"
    permission: "punish.use"
  ahome:
    aliases: [adminhome]
    usage: "/ahome <player>"
    description: "প্লেয়ারের সমস্ত হোম দেখতে ও অ্যাকশন মেনু খোলার জন্য।"
    permission: "havencore.admin.ahome"

permissions:
  core-admin:
    havencore.reload:
      description: "প্লাগইনের কনফিগ রিলোড করার অনুমতি দেয়।"
      default: "op"
    havencore.admin.ahome:
      description: "প্লেয়ারের হোম ম্যানেজ করার GUI খোলার অনুমতি দেয়।"
      default: "op"
  leaderboard:
    leaderboard.use:
      description: "প্লেয়ারদের লিডারবোর্ড দেখার অনুমতি দেয়।"
      default: "true"
    leaderboard.reload:
      description: "লিডারবোর্ডের কনফিগ রিলোড করার অনুমতি দেয়।"
      default: "op"
  player-settings:
    settings.use:
      description: "নিজস্ব সেটিংস মেনু খোলার অনুমতি দেয়।"
      default: "true"
    settings.admin:
      description: "অন্য প্লেয়ারদের সেটিংস পরিবর্তন করার অনুমতি দেয়।"
      default: "op"
    settings.reload:
      description: "HavenSettings কনফিগ রিলোড করার অনুমতি দেয়।"
      default: "op"
    settings.nv:
      description: "নাইট ভিশন কমান্ড ব্যবহারের অনুমতি দেয়।"
      default: "true"
    settings.sb:
      description: "স্কোরবোর্ড কমান্ড ব্যবহারের অনুমতি দেয়।"
      default: "true"
  punishments:
    punish.use:
      description: "শাস্তি দেওয়ার GUI খোলার অনুমতি দেয়।"
      default: "op"
    punish.ban:
      description: "প্লেয়ারকে Ban/Tempban করার অনুমতি দেয়।"
      default: "op"
    punish.mute:
      description: "প্লেয়ারকে Mute/Tempmute করার অনুমতি দেয়।"
      default: "op"
    punish.kick:
      description: "প্লেয়ারকে Kick করার অনুমতি দেয়।"
      default: "op"
    punish.warn:
      description: "প্লেয়ারকে Warn করার অনুমতি দেয়।"
      default: "op"
    punish.ipban:
      description: "প্লেয়ারকে IP-Ban করার অনুমতি দেয়।"
      default: "op"
    punish.silent:
      description: "সাইলেন্ট শাস্তি দেওয়ার ক্ষমতা দেয়।"
      default: "op"
    punish.reload:
      description: "HavenPunish কনফিগ রিলোড করার অনুমতি দেয়।"
      default: "op"
    punish.exempt:
      description: "এই পারমিশন থাকলে তাকে শাস্তি দেওয়া যাবে না।"
      default: "false"
