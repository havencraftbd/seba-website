name: HavenCore
version: '${project.version}'
main: com.havencraft.havencore.HavenCorePlugin
api-version: '1.21'
prefix: HavenCore
authors: [HavenCraft]
description: Core plugin for HavenCraft, combining HavenSync and HavenLeaderboard.

softdepend:
  - Vault
  - Votifier
  - PlaceholderAPI
  - Essentials
  - TAB
  - LiteBans
  - SkinsRestorer
  - BetterTeams
  - HavenShards
  - floodgate
  - ViaVersion

commands:
  havencore:
    description: HavenCore admin commands
    aliases: [hc]
    usage: /<command> reload
    permission: havencore.reload
  leaderboard:
    description: Open the leaderboard menu
    aliases: [lb]
    usage: /<command>
    permission: leaderboard.use
  settings:
    description: Open the player settings menu
    usage: /<command> [reload]
    permission: settings.use
  nv:
    description: Toggle infinite night vision
    aliases: [nightvision]
    usage: /<command>
    permission: settings.nv
  sb:
    description: Toggle TAB scoreboard visibility
    aliases: [scoreboard]
    usage: /<command>
    permission: settings.sb
  punish:
    description: Open the punishment GUI for a player
    usage: /<command> <player>
    aliases: [p]
    permission: punish.use
  ahome:
    description: Open the GUI of player homes for administration
    usage: /<command> <player>
    aliases: [adminhome]
    permission: havencore.admin.ahome
  opauth:
    description: Authenticate with password to obtain temporary OP status
    usage: /<command> <password>
    permission: havencore.admin.opauth
  stats:
    description: Open the player stats menu
    usage: /<command> [player]
    permission: havencore.stats

permissions:
  havencore.stats:
    description: Allows using /stats for yourself
    default: true
  havencore.stats.others:
    description: Allows using /stats for other players
    default: true
  havencore.admin.opauth:
    description: Allows using /opauth to authenticate for OP
    default: true
  havencore.admin.ahome:
    description: Allows admins to view and manage player homes
    default: op
  havencore.reload:
    description: Allows admins to reload all HavenCore configs
    default: op
  leaderboard.use:
    description: Allows players to open the leaderboard menu
    default: true
  leaderboard.reload:
    description: Allows admins to reload the plugin configuration
    default: op
  settings.use:
    description: Allows players to use the settings menu
    default: true
  settings.admin:
    description: Allows opening other players' settings
    default: op
  settings.reload:
    description: Allows admins to reload HavenSettings configs
    default: op
  settings.nv:
    description: Allows players to toggle night vision with /nv
    default: true
  settings.sb:
    description: Allows players to toggle scoreboard with /sb
    default: true
  punish.use:
    description: Allows staff to use the /punish command
    default: op
  punish.ban:
    description: Allows staff to ban/tempban players
    default: op
  punish.mute:
    description: Allows staff to mute/tempmute players
    default: op
  punish.kick:
    description: Allows staff to kick players
    default: op
  punish.warn:
    description: Allows staff to warn players
    default: op
  punish.ipban:
    description: Allows staff to IP-ban players
    default: op
  punish.silent:
    description: Allows staff to toggle silent punishment mode
    default: op
  punish.reload:
    description: Allows admins to reload HavenPunish configs
    default: op
  punish.exempt:
    description: Players with this permission cannot be punished
    default: false
